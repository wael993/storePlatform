# CI / isolated local Mongo — not used with Atlas dev .env
services:
  mongodb:
    image: mongo:7
    # Single-node replica set: cash ledger writes use transactions, which standalone Mongo rejects.
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:27018:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the set on first run; healthy only once this node is primary.
      test:
        [
          'CMD',
          'mongosh',
          '--quiet',
          '--eval',
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }; db.hello().isWritablePrimary || quit(1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: store_platform
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/store_platform
      BUSINESS_PLATFORM_MONGO_DB_CONNECTION_STRING: mongodb://mongodb:27017/bsp-BUSINESS-platform-store-dev
      BUSINESS_PLATFORM_MONGO_DB_DATABASE_NAME: bsp-BUSINESS-platform-store-dev

volumes:
  mongo_data:
