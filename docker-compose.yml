# Root .env → api (Mongo, JWT, Redis, AI). Same DB as npm run dev when .env matches services/api-store-platform/.env
services:
  api:
    build: ./services/api-store-platform
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      SUPER_ADMIN_TENANT_ID: ${SUPER_ADMIN_TENANT_ID:-super-admin}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/test').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 180s

  web:
    build: ./web/store-platform-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
