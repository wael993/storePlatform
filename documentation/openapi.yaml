components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /api/data/login or /refresh
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Authenticated but not allowed (role, page access, or expired subscription)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Business rule conflict or validation failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        errorCode:
          type: string
        hint:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
    Paginated:
      type: object
      properties:
        totalCount:
          type: integer
        data:
          type: array
          items:
            type: object
            additionalProperties: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
    BulkIdsRequest:
      type: object
      properties:
        productIds:
          type: array
          items:
            type: string
        customerIds:
          type: array
          items:
            type: string
        supplierIds:
          type: array
          items:
            type: string
        partnerIds:
          type: array
          items:
            type: string
        projectIds:
          type: array
          items:
            type: string
        categoryIds:
          type: array
          items:
            type: string
    BulkActionIdsRequest:
      type: object
      properties:
        actionIds:
          type: array
          items:
            type: string
    BulkEditProductsRequest:
      type: object
      additionalProperties: true
      description: Product ids plus fields to apply
    ProductPrice:
      type: object
      required: [retailPrice, currency]
      properties:
        purchasePrice:
          type: number
        retailPrice:
          type: number
        wholesalePrice:
          type: number
        semiWholesalePrice:
          type: number
        discount:
          type: number
        currency:
          type: string
    ProductRequest:
      type: object
      required: [productId, name, barcode, price, status]
      properties:
        productId:
          type: string
        name:
          type: string
        latinName:
          type: string
        barcode:
          type: string
        additionalBarcodes:
          type: array
          items:
            type: string
        internalCode:
          type: string
        productFactoryCode:
          type: string
        categoryId:
          type: string
        brandId:
          type: string
        supplierId:
          type: string
        unitId:
          type: string
        taxRate:
          type: string
        price:
          $ref: '#/components/schemas/ProductPrice'
        status:
          type: string
          enum: [active, inactive]
        description:
          type: string
        quantity:
          type: number
        minQuantity:
          type: number
        warehouseId:
          type: string
        shelfId:
          type: string
        images:
          type: array
          items:
            type: string
    ProductPatchRequest:
      allOf:
        - $ref: '#/components/schemas/ProductRequest'
      description: Partial product update (send changed fields)
    InventoryRequest:
      type: object
      required: [productId]
      properties:
        productId:
          type: string
        warehouseId:
          type: string
        shelfId:
          type: string
        quantity:
          type: number
        minQuantity:
          type: number
        availableQuantity:
          type: number
    InventoryPatchRequest:
      type: object
      additionalProperties: true
    WarehouseTransferRequest:
      type: object
      additionalProperties: true
      description: Source/destination warehouses and line items
    DailyActionRequest:
      type: object
      required: [entryType, currencyId, currencyName, invoiceDate]
      properties:
        entryType:
          type: string
          enum:
            - BUYING_ENTRY
            - SELLING_ENTRY
            - PAYMENT_ENTRY
            - RECEIPT_ENTRY
            - EXPENSE_ENTRY
            - EMPLOYEE_COST
            - OTHER_COST
        warehouseId:
          type: string
        productId:
          type: string
        productName:
          type: string
        supplierId:
          type: string
        customerId:
          type: string
        partnerId:
          type: string
        projectId:
          type: string
        employeeId:
          type: string
        expenseId:
          type: string
        currencyId:
          type: string
        currencyName:
          type: string
        cashAccountType:
          type: string
        unitId:
          type: string
        weight:
          type: string
        singleUnitPrice:
          type: string
        totalPrice:
          type: string
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date-time
        note:
          type: string
    SyncPushRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [clientMutationId, entity, operation, url, method, payload]
            properties:
              clientMutationId:
                type: string
              entity:
                type: string
              operation:
                type: string
              url:
                type: string
              method:
                type: string
              payload:
                type: object
                additionalProperties: true
        retryClientMutationIds:
          type: array
          items:
            type: string
    NamedEntityRequest:
      type: object
      properties:
        name:
          type: string
        internalCode:
          type: string
      additionalProperties: true
    BrandRequest:
      type: object
      required: [name]
      properties:
        brandId:
          type: string
        name:
          type: string
        description:
          type: string
    WarehouseRequest:
      type: object
      required: [name]
      properties:
        warehouseId:
          type: string
        name:
          type: string
        code:
          type: string
        address:
          type: string
        status:
          type: string
          enum: [active, inactive]
        description:
          type: string
    CustomerRequest:
      type: object
      required: [customerId, name]
      properties:
        customerId:
          type: string
        name:
          type: string
        internalCode:
          type: string
    SupplierRequest:
      type: object
      required: [supplierId, name]
      properties:
        supplierId:
          type: string
        name:
          type: string
        internalCode:
          type: string
    PartnerRequest:
      type: object
      required: [partnerId, name]
      properties:
        partnerId:
          type: string
        name:
          type: string
        internalCode:
          type: string
    ProjectRequest:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: string
        name:
          type: string
        internalCode:
          type: string
        contractCost:
          type: number
    CategoryRequest:
      type: object
      required: [categoryId, name]
      properties:
        categoryId:
          type: string
        name:
          type: string
        description:
          type: string
        parentCategoryId:
          type: string
    OpeningBalancePatch:
      type: object
      additionalProperties: true
      description: Opening-balance adjustment for a customer or supplier
    InvoiceLineItem:
      type: object
      required: [productId, name, quantity, unitPrice]
      properties:
        productId:
          type: string
        name:
          type: string
        barcode:
          type: string
        quantity:
          type: number
        unit:
          type: string
        unitPrice:
          type: number
        discount:
          type: number
        discountIsPercent:
          type: boolean
        taxRate:
          type: number
        lineTotal:
          type: number
    CurrencyAmount:
      type: object
      required: [currencyId, name, exchangeRate, isPrimary, amount, paidAmount, remainingAmount, subtotal, tax, discount]
      properties:
        currencyId:
          type: string
        name:
          type: string
        internalCode:
          type: string
        exchangeRate:
          type: number
        isPrimary:
          type: boolean
        amount:
          type: number
        paidAmount:
          type: number
        remainingAmount:
          type: number
        subtotal:
          type: number
        tax:
          type: number
        discount:
          type: number
    SellingInvoiceRequest:
      type: object
      required: [currencyAmounts, warehouseId]
      properties:
        invoiceId:
          type: string
        clientMutationId:
          type: string
        invoiceNumber:
          type: string
        projectId:
          type: string
        customerId:
          type: string
        customerName:
          type: string
        salesPerson:
          type: string
        paymentType:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        status:
          type: string
        paymentStatus:
          type: string
        invoiceCurrencyId:
          type: string
        cashAccountType:
          type: string
        tenders:
          type: array
          items:
            type: object
            properties:
              currencyId:
                type: string
              tenderedAmount:
                type: number
        currencyAmounts:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyAmount'
        notes:
          type: string
        warehouseId:
          type: string
        issuedAt:
          type: string
          format: date-time
        invoiceDiscount:
          type: number
        invoiceDiscountIsPercent:
          type: boolean
        printAfterPayment:
          type: boolean
    BuyingInvoiceRequest:
      type: object
      required: [currencyAmounts, warehouseId]
      properties:
        buyingInvoiceId:
          type: string
        clientMutationId:
          type: string
        invoiceNumber:
          type: string
        supplierId:
          type: string
        supplierName:
          type: string
        supplierInvoiceNumber:
          type: string
        paymentType:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceLineItem'
        status:
          type: string
        paymentStatus:
          type: string
        invoiceCurrencyId:
          type: string
        cashAccountType:
          type: string
        tenders:
          type: array
          items:
            type: object
            additionalProperties: true
        currencyAmounts:
          type: array
          items:
            $ref: '#/components/schemas/CurrencyAmount'
        notes:
          type: string
        warehouseId:
          type: string
        issuedAt:
          type: string
          format: date-time
        invoiceDiscount:
          type: number
        invoiceDiscountIsPercent:
          type: boolean
    InvoiceExtractRequest:
      type: object
      additionalProperties: true
      description: Multipart/base64 file payload for invoice AI extraction
    ReportRequest:
      type: object
      required: [name, type, periodStart, periodEnd, data]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [sales, inventory, finance, operations]
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        data:
          type: object
          additionalProperties: true
    ReportChatRequest:
      type: object
      additionalProperties: true
      description: RIVO chat messages and tool context
    InviteUserRequest:
      type: object
      required: [firstName, lastName, email, role]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
    RoleSeeRequest:
      type: object
      properties:
        see:
          type: array
          items:
            type: string
    CashTransferRequest:
      type: object
      additionalProperties: true
      description: From/to cash account types, amount, currency
    ProductImportParseRequest:
      type: object
      properties:
        files:
          type: array
          items:
            type: object
            additionalProperties: true
        currency:
          type: string
        selectedFields:
          type: array
          items:
            type: string
security:
  - bearerAuth: []
