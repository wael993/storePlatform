openapi: 3.0.3
info:
  title: Store Platform API
  version: 1.0.0
  description: |
    Multi-tenant store platform HTTP API (`services/api-store-platform`).

    **Base path:** `/api/data`

    **Authentication:** Most endpoints require `Authorization: Bearer <accessToken>`.
    Login/refresh set an httpOnly `refreshToken` cookie (path `/api/data`).

    **Warehouse scope:** Authenticated requests may send `x-warehouse-scope`
    (comma-separated warehouse ids). Working scope = ACL ∩ selection.

    **Errors:** Business conflicts commonly return HTTP 409 with
    `{ message, errorCode?, hint?, fields? }`. Auth failures return 401/403.
  contact:
    name: Store Platform
servers:
  - url: http://localhost:3001
    description: Local API (npm run dev / Docker api service)
  - url: http://localhost:3000
    description: Via frontend nginx proxy (same-origin `/api/data`)
tags:
  - name: Auth
    description: "Login, refresh, logout, password"
  - name: Products
    description: Product catalog and mutations
  - name: Inventory
    description: Stock levels and warehouse transfers
  - name: DailyActions
    description: Ledger / daily movement entries
  - name: Sync
    description: "Offline bootstrap, changes, and push"
  - name: Expenses
    description: Expense master data
  - name: CashAccounts
    description: "Cash balances, ledger, transfers"
  - name: Budget
    description: Party budget overview
  - name: MasterData
    description: "Currencies, units, brands, shelves"
  - name: Warehouses
    description: Warehouse master data
  - name: Customers
    description: Customers
  - name: Suppliers
    description: Suppliers
  - name: Partners
    description: Partners
  - name: Projects
    description: Projects
  - name: Categories
    description: Product categories
  - name: SellingInvoices
    description: Sales invoices
  - name: BuyingInvoices
    description: Purchase invoices and invoice AI
  - name: Reports
    description: Saved reports and RIVO AI chat
  - name: Settings
    description: "User, currency, invoice, label settings"
  - name: Users
    description: Tenant user management
  - name: Permissions
    description: Role SEE permissions
  - name: Subscription
    description: Subscription and renewals
  - name: Tenants
    description: "Super-admin tenant management"
  - name: Employees
    description: "Employees, salaries, payouts"
  - name: Notifications
    description: "Product / low-stock notifications"
  - name: Newsroom
    description: "Topics, feed, release notes"
  - name: ProductImport
    description: Excel product import wizard
  - name: Health
    description: Health checks
